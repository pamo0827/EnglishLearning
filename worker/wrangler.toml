# 教材音声の鍵を、パスワードと引き換えに渡す Worker。
#
#   cd worker && wrangler deploy
#   wrangler secret put LESSON_KEY    # .env の LESSON_KEY と同じ値
#   wrangler secret put LESSON_PASSWORD   # 共有するパスワード（npm run lessons:password でも設定できる）
name = "english-learning-key"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://englishlearning.yoshikatsu.dev,https://pamo0827.github.io,http://localhost:3000"
