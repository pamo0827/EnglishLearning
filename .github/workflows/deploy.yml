name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、後続を1つだけ待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 採点エンジンの回帰テスト。失敗したらデプロイしない
      - name: Test grading engine
        run: npm run grade:test

      # content/questions.ts から公開データと暗号化済みの正解を書き出す
      - name: Build content
        run: npm run content:build

      - name: Build site
        run: npm run build
        env:
          # プロジェクトページは https://<user>.github.io/<repo>/ に置かれる
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Cloudflare Web Analytics。リポジトリの Variables に CF_BEACON_TOKEN を
          # 設定すると計測が有効になる（未設定なら何も読み込まない）
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
